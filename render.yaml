databases:
  - name: forum-db
    databaseName: forum
    user: forum
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: forum-api
    runtime: node
    region: singapore
    plan: free
    branch: feature/forum-complete
    buildCommand: npm install -g pnpm@12.4.1 && pnpm install --frozen-lockfile --prod=false && pnpm --filter api exec prisma generate && pnpm --filter api build
    startCommand: pnpm --filter api exec prisma migrate deploy && node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forum-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_DAYS
        value: "7"
      - key: WEB_ORIGIN
        sync: false
      - key: DEFAULT_LEARNER_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: forum-web
    runtime: node
    region: singapore
    plan: free
    branch: feature/forum-complete
    buildCommand: npm install -g pnpm@12.4.1 && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_TARGET
        sync: false